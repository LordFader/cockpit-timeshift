name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: node --check parsers.js timeshift.js
      - name: Unit tests
        run: node --test test/parsers.test.js
      - name: Validate manifest schema (dev)
        run: node scripts/validate-manifest.js manifest.json
      - name: Validate manifest schema (production build)
        run: |
          sed -e 's/"timeshift-dev"/"timeshift"/' -e 's/"Timeshift Dev"/"Timeshift"/' manifest.json > /tmp/manifest.json
          node scripts/validate-manifest.js /tmp/manifest.json --no-path-check
      - name: Lint
        run: |
          npm ci
          npm run lint
      - name: Shell syntax check
        run: sh -n install.sh