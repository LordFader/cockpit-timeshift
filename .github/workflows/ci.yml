name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: node --check parsers.js timeshift.js
      - name: Unit tests
        run: node --test test/parsers.test.js
      - name: Lint
        run: |
          npm ci
          npm run lint
      - name: Shell syntax check
        run: sh -n install.sh